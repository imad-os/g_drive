<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a30"><title>Cloud Shelf</title><style>
:root{--bg:#101a30;--panel:#172442;--panel2:#1d2d50;--line:#31466f;--text:#f2f7ff;--muted:#a7b7d4;--cyan:#62e4ef;--blue:#6c81ff;--focus:#f8cf68}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 70% 0,#213968 0,#101a30 52%)}header{height:14vh;min-height:84px;padding:2.6vh 4.2vw 1.6vh;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(125,160,214,.24)}.brand{display:flex;gap:1.4vw;align-items:center}.cloud{width:7.4vh;height:5.2vh;position:relative}.cloud:before{content:"";position:absolute;left:8%;bottom:5%;width:80%;height:47%;border:6px solid var(--cyan);border-radius:99px}.cloud:after{content:"";position:absolute;left:32%;top:2%;width:34%;height:46%;border:6px solid var(--cyan);border-radius:99px;background:var(--bg)}h1{font-size:4.2vh;line-height:1;margin:0;letter-spacing:.04em}#status{font-size:2.35vh;color:var(--cyan);font-weight:700}.layout{flex:1;min-height:0;display:grid;grid-template-columns:25% 1fr}.sidebar{padding:2.5vh 1.8vw 2vh 4.2vw;border-right:1px solid rgba(125,160,214,.24)}.side-title,.section-label{color:var(--muted);font-size:1.8vh;font-weight:700;letter-spacing:.08em;margin:0 0 1.6vh}.nav-item{height:6.5vh;min-height:43px;padding:0 1.2vw;display:flex;align-items:center;gap:1vw;border:3px solid transparent;border-radius:12px;color:#dce8fa;font-size:2.4vh;font-weight:700;margin-bottom:.8vh}.nav-icon{width:2.5vh;text-align:center;color:var(--cyan)}.nav-item.selected{border-color:var(--focus);background:#26375d;color:#fff;box-shadow:0 0 0 2px rgba(248,207,104,.14)}.space{margin-top:4vh;padding:0 1vw}.meter{height:1.3vh;background:#0d1529;border-radius:99px;overflow:hidden;margin:1.2vh 0}.meter i{display:block;width:37%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px}.space small{display:block;color:var(--muted);font-size:1.8vh}.main{padding:2.3vh 4.2vw 2vh;min-width:0}.crumbs{font-size:2.25vh;color:var(--muted);margin-bottom:2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumbs strong{color:#fff}.content{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.7vh 1.2vw}.item{height:22vh;min-height:135px;border:3px solid transparent;border-radius:16px;background:rgba(28,45,80,.68);padding:2.3vh 1.15vw 1.4vh;display:flex;flex-direction:column;justify-content:space-between}.item.selected{border-color:var(--focus);background:#2a3d68;box-shadow:0 0 0 3px rgba(248,207,104,.13)}.file-icon{height:9vh;display:flex;align-items:center;justify-content:center;font-size:7.4vh;line-height:1}.folder{color:#75cbff}.doc,.text,.html{color:#d9e3ff}.photo{color:#cf8cff}.video{color:#ffa869}.audio{color:#78e8bd}.item-name{font-size:2.35vh;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.item-meta{font-size:1.65vh;color:var(--muted);text-align:center;margin-top:.7vh}.empty{grid-column:1/-1;padding:7vh;text-align:center;color:var(--muted);font-size:2.6vh}.preview{position:absolute;inset:0;background:rgba(4,10,23,.92);display:flex;align-items:center;justify-content:center;padding:5vh 6vw}.preview.hidden{display:none}.preview-card{width:78vw;height:78vh;background:#19294a;border:3px solid var(--focus);border-radius:20px;padding:3vh 3vw;text-align:center;box-shadow:0 2vh 8vh rgba(0,0,0,.45);display:flex;flex-direction:column}.preview-icon{font-size:10vh}.preview-card h2{font-size:3.5vh;margin:1vh 0}.preview-card p{font-size:2.2vh;color:var(--muted);margin:0}.photo-stage{flex:1;min-height:0;margin:1vh 0;display:none;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#3f3180,#d481a9 48%,#ffc971);overflow:hidden}.photo-stage.show{display:flex}.photo-art{width:56%;height:66%;border:1.2vh solid rgba(255,255,255,.75);border-radius:10px;background:linear-gradient(145deg,#75d8ff 0 48%,#4365b5 49% 61%,#e9ad6d 62%);box-shadow:0 2vh 4vh rgba(0,0,0,.28)}.text-stage{flex:1;min-height:0;display:none;margin:1vh 0;padding:2vh 2vw;overflow:auto;text-align:left;white-space:pre-wrap;background:#0d172b;border-radius:14px;color:#e1ebff;font:2.15vh/1.45 Consolas,monospace}.text-stage.show{display:block}.preview-controls{display:none;justify-content:space-between;align-items:center;margin-top:1vh}.preview-controls.show{display:flex}.control{min-width:15vw;border:3px solid var(--focus);border-radius:12px;padding:1.2vh 1vw;font-size:2.2vh;font-weight:700;color:#fff}.hint{height:8vh;min-height:54px;border-top:1px solid rgba(125,160,214,.24);padding:0 4.2vw;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:2vh}.hint b{color:#fff}.connection{color:#8df0cb}.offline{color:#ffc46d}@media(max-width:800px){.content{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:29% 1fr}.item{height:19vh}}
</style></head><body><div id="app"><header><div class="brand"><span class="cloud"></span><div><h1>CLOUD SHELF</h1><div id="status">CLOUD LIBRARY</div></div></div><div id="connection" class="connection">● CONNECTED</div></header><div class="layout"><aside class="sidebar"><p class="side-title" id="side-title">CLOUD LOCATIONS</p><div id="nav"></div><div class="space"><p class="section-label" id="storage-label">CLOUD STORAGE</p><div class="meter"><i></i></div><small id="storage-text">7.4 GB of 20 GB used</small></div></aside><main class="main"><div class="crumbs" id="crumbs"></div><div class="content" id="content"></div></main></div><footer class="hint"><span id="hint"><b>ARROWS</b> move &nbsp; <b>OK</b> open</span><span id="profile"></span></footer><div id="preview" class="preview hidden"><div class="preview-card"><div id="preview-icon" class="preview-icon"></div><h2 id="preview-name"></h2><p id="preview-info"></p><div id="photo-stage" class="photo-stage"><div class="photo-art"></div></div><pre id="text-stage" class="text-stage"></pre><div id="preview-controls" class="preview-controls"><span id="previous" class="control">← PREVIOUS</span><span id="preview-hint"></span><span id="next" class="control">NEXT →</span></div></div></div></div><script src="https://imad-os.github.io/g/sdk/mypc-sdk.js"></script><script>
(function(){'use strict';
var VERSION='1.1.0',info,lang='en',t,active='files',navIndex=0,itemIndex=0,current='root',previewing=false,previewItem=null,photoIndex=0,audio=null,focusGain=null,provider='demo',providerUrl='',workspaceId='',demoMode=true,raf=0,last=0,acc=0,STEP=1000/60;
var TEXT={en:{cloud:'CLOUD LIBRARY',connected:'● CONNECTED',offline:'● DEMO LIBRARY',locations:'CLOUD LOCATIONS',storage:'CLOUD STORAGE',used:'7.4 GB of 20 GB used',files:'My files',recent:'Recent',shared:'Shared with me',photos:'Photos',trash:'Trash',move:'move',open:'open',back:'close preview',previous:'← PREVIOUS',next:'NEXT →',empty:'This folder is empty.',preview:'Cloud preview',previewText:'This file stays in your cloud library.',source:'Source preview',profile:'Cloud space for ',refresh:'Refresh',root:'My files'},fr:{cloud:'BIBLIOTHÈQUE CLOUD',connected:'● CONNECTÉ',offline:'● BIBLIOTHÈQUE DÉMO',locations:'EMPLACEMENTS CLOUD',storage:'STOCKAGE CLOUD',used:'7,4 Go sur 20 Go utilisés',files:'Mes fichiers',recent:'Récents',shared:'Partagés avec moi',photos:'Photos',trash:'Corbeille',move:'déplacer',open:'ouvrir',back:'fermer l’aperçu',previous:'← PRÉCÉDENT',next:'SUIVANT →',empty:'Ce dossier est vide.',preview:'Aperçu cloud',previewText:'Ce fichier reste dans votre bibliothèque cloud.',source:'Aperçu de la source',profile:'Espace cloud de ',refresh:'Actualiser',root:'Mes fichiers'},es:{cloud:'BIBLIOTECA EN LA NUBE',connected:'● CONECTADO',offline:'● BIBLIOTECA DE DEMO',locations:'UBICACIONES EN LA NUBE',storage:'ALMACENAMIENTO EN LA NUBE',used:'7,4 GB de 20 GB usados',files:'Mis archivos',recent:'Recientes',shared:'Compartido conmigo',photos:'Fotos',trash:'Papelera',move:'mover',open:'abrir',back:'cerrar vista previa',previous:'← ANTERIOR',next:'SIGUIENTE →',empty:'Esta carpeta está vacía.',preview:'Vista previa en la nube',previewText:'Este archivo permanece en tu biblioteca en la nube.',source:'Vista previa de origen',profile:'Espacio en la nube de ',refresh:'Actualizar',root:'Mis archivos'},ar:{cloud:'مكتبة سحابية',connected:'● متصل',offline:'● مكتبة تجريبية',locations:'مواقع سحابية',storage:'التخزين السحابي',used:'٧٫٤ غيغابايت من ٢٠ غيغابايت مستخدمة',files:'ملفاتي',recent:'الأخيرة',shared:'تمت مشاركتها معي',photos:'الصور',trash:'سلة المحذوفات',move:'تنقل',open:'فتح',back:'إغلاق المعاينة',previous:'السابق ←',next:'→ التالي',empty:'هذا المجلد فارغ.',preview:'معاينة سحابية',previewText:'يبقى هذا الملف في مكتبتك السحابية.',source:'معاينة المصدر',profile:'المساحة السحابية لـ ',refresh:'تحديث',root:'ملفاتي'}};
var NAV=['files','recent','shared','photos','trash'];
var DB={root:[['Projects','folder','12 items'],['Travel 2026','folder','84 photos'],['Family','folder','26 items'],['Recipes','folder','9 items'],['Welcome.pdf','doc','1.8 MB'],['Readme.txt','text','2 KB']],Projects:[['Design notes.pdf','doc','2.2 MB'],['Launch plan','folder','6 items'],['Cover image.png','photo','4.1 MB'],['index.html','html','3 KB']],Travel:[['Reykjavik','folder','48 photos'],['Coast.png','photo','4.3 MB'],['Northern sky.jpg','photo','5.8 MB'],['Coast.mp4','video','38 MB'],['Packing list.pdf','doc','470 KB']],Family:[['Shared album','photo','126 photos'],['Portrait.png','photo','2.4 MB'],['Voice memo.m4a','audio','7.8 MB']],Recipes:[['Weekend menu.pdf','doc','820 KB']],recent:[['Welcome.pdf','doc','1.8 MB'],['Coast.png','photo','4.3 MB'],['Cover image.png','photo','4.1 MB'],['Readme.txt','text','2 KB']],shared:[['Studio brief.pdf','doc','1.2 MB'],['Shared album','photo','126 photos']],photos:[['Coast.png','photo','4.3 MB'],['Northern sky.jpg','photo','5.8 MB'],['Cover image.png','photo','4.1 MB'],['Portrait.png','photo','2.4 MB']],trash:[]};
var FILE_TEXT={'Readme.txt':'Cloud Shelf demo library\n\nUse the arrow keys to explore folders and open previews.\n\nWhen Dropbox is connected, this preview will show text content from the cloud proxy.','index.html':'<!doctype html>\n<html lang="en">\n  <head>\n    <meta charset="utf-8">\n    <title>Project cover</title>\n  </head>\n  <body>\n    <main>Cloud Shelf project page</main>\n  </body>\n</html>'};
function $(id){return document.getElementById(id)}function icon(type){return type==='folder'?'▰':type==='photo'?'▧':type==='video'?'▶':type==='audio'?'♫':type==='html'?'‹›':'▤'}function cls(type){return type==='folder'?'folder':type}
function playFocus(){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=520;g.gain.value=(info.volume?info.volume.sfx:.8)*.018;o.connect(g);g.connect(focusGain);o.start();o.stop(audio.currentTime+.045)}catch(e){}}
function initAudio(){if(audio)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{audio=new C();focusGain=audio.createGain();focusGain.gain.value=1;focusGain.connect(audio.destination)}catch(e){audio=null}}
function stopAudio(){if(audio){try{audio.close()}catch(e){}audio=null;focusGain=null}}
function label(key){return t[key]||key}function folderKey(name){if(name==='Travel 2026')return'Travel';return name.replace(' ','')}
function currentItems(){return DB[current]||DB.root}
function render(){var nav=$('nav'),content=$('content'),items=currentItems(),html='',i;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('status').textContent=t.cloud;$('connection').textContent=demoMode?t.offline:t.connected;$('connection').className=demoMode?'offline':'connection';$('side-title').textContent=t.locations;$('storage-label').textContent=t.storage;$('storage-text').textContent=t.used;$('hint').innerHTML='<b>ARROWS</b> '+t.move+' &nbsp; <b>OK</b> '+t.open;$('profile').textContent=t.profile+(info.profile&&info.profile.name||'');
for(i=0;i<NAV.length;i++)html+='<div class="nav-item '+(active==='nav'&&navIndex===i?'selected':'')+'"><span class="nav-icon">'+(i===0?'☁':i===1?'◷':i===2?'♧':i===3?'▧':'⌫')+'</span>'+label(NAV[i])+'</div>';nav.innerHTML=html;var path=current==='root'?'':' &nbsp;›&nbsp; '+current;$('crumbs').innerHTML='<strong>☁ '+t.files+'</strong>'+path;html='';if(!items.length)html='<div class="empty">'+t.empty+'</div>';for(i=0;i<items.length;i++){var it=items[i];html+='<div class="item '+(active==='files'&&itemIndex===i?'selected':'')+'"><div class="file-icon '+cls(it[1])+'">'+icon(it[1])+'</div><div><div class="item-name">'+it[0]+'</div><div class="item-meta">'+it[2]+'</div></div></div>'}content.innerHTML=html}
function showPreview(it){var photos=currentItems().filter(function(x){return x[1]==='photo'});previewItem=it;previewing=true;$('preview-icon').className='preview-icon '+cls(it[1]);$('preview-icon').textContent=icon(it[1]);$('preview-name').textContent=it[0];$('photo-stage').className='photo-stage';$('text-stage').className='text-stage';$('preview-controls').className='preview-controls';$('previous').textContent=t.previous;$('next').textContent=t.next;if(it[1]==='photo'){photoIndex=Math.max(0,photos.indexOf(it));$('photo-stage').className='photo-stage show';$('preview-info').textContent=(photoIndex+1)+' / '+photos.length+' · '+t.previewText;$('preview-controls').className='preview-controls show';$('preview-hint').textContent='OK · '+t.back}else if(it[1]==='text'||it[1]==='html'){$('text-stage').className='text-stage show';$('text-stage').textContent=FILE_TEXT[it[0]]||t.previewText;$('preview-info').textContent=t.source+' · '+it[2];$('preview-hint').textContent='OK · '+t.back}else{$('preview-info').textContent=t.preview+' · '+it[2]+' · '+t.previewText;$('preview-hint').textContent='OK · '+t.back}$('preview').className='preview';MyPC.announce(it[0]+'. '+t.preview)}
function openItem(){var it=currentItems()[itemIndex];if(!it)return;if(it[1]==='folder'){current=folderKey(it[0]);itemIndex=0;MyPC.save('lastFolder',current);MyPC.announce(it[0]);render();return}showPreview(it)}
function changePhoto(direction){var photos=currentItems().filter(function(x){return x[1]==='photo'});if(photos.length<2)return;photoIndex=(photoIndex+direction+photos.length)%photos.length;showPreview(photos[photoIndex])}
function closePreview(){previewing=false;previewItem=null;$('preview').className='preview hidden';render()}
function selectNav(){current=NAV[navIndex];if(current==='files')current='root';active='files';itemIndex=0;MyPC.save('lastFolder',current);render();MyPC.announce(label(NAV[navIndex]))}
function move(action){var items=currentItems();if(active==='nav'){if(action==='up')navIndex=(navIndex+NAV.length-1)%NAV.length;if(action==='down')navIndex=(navIndex+1)%NAV.length;if(action==='right'){active='files';itemIndex=Math.min(itemIndex,Math.max(0,items.length-1))}}else{if(action==='left'){if(itemIndex%4===0)active='nav';else itemIndex--}if(action==='right'&&itemIndex<items.length-1)itemIndex++;if(action==='up'&&itemIndex>=4)itemIndex-=4;if(action==='down'&&itemIndex+4<items.length)itemIndex+=4}playFocus();render()}
function refresh(){render();MyPC.announce(t.refresh)}
function update(){/* Fixed step reserved for provider refresh state; no allocation in this loop. */}
function frame(ts){raf=requestAnimationFrame(frame);if(!last)last=ts;acc+=Math.min(250,ts-last);last=ts;while(acc>=STEP){update();acc-=STEP}}
function startLoop(){if(!raf){last=0;acc=0;raf=requestAnimationFrame(frame)}}function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
MyPC.init({onInit:function(i){info=i||{};lang=info.lang||'en';t=TEXT[lang]||TEXT.en;var config=MyPC.app_config||{};provider=String(config.provider||'demo');providerUrl=String(config.providerUrl||'');workspaceId=String(config.workspaceId||'');demoMode=config.demoMode!==false||provider!=='dropbox'||!providerUrl;current=MyPC.load('lastFolder','root');if(!DB[current])current='root';MyPC.setMenu([{id:'refresh',label:t.refresh},{id:'home',label:t.files}]);MyPC.progress(.4);render();MyPC.progress(1);MyPC.ready()},onStart:function(){initAudio();render();startLoop();MyPC.announce('Cloud Shelf. '+t.files)},onPause:function(){stopLoop();if(audio){try{audio.suspend()}catch(e){}}},onResume:function(){if(audio){try{audio.resume()}catch(e){}}startLoop()},onDestroy:function(){stopLoop();stopAudio()},onInput:function(action,pressed,repeat){if(!pressed)return;if(previewing){if(previewItem&&previewItem[1]==='photo'&&action==='left')changePhoto(-1);if(previewItem&&previewItem[1]==='photo'&&action==='right')changePhoto(1);if((action==='confirm'||action==='jump')&&!repeat)closePreview();return}if(action==='left'||action==='right'||action==='up'||action==='down')move(action);if((action==='confirm'||action==='jump')&&!repeat){if(active==='nav')selectNav();else openItem()}},onMenu:function(id){if(id==='refresh')refresh();if(id==='home'){current='root';active='files';itemIndex=0;render()}},onVolume:function(v){if(focusGain)focusGain.gain.value=v.sfx}});
})();
</script></body></html>
